<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09051a" />
    <title>Portfolio sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #09051a;
        color: #fdf4ff;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at 70% 10%, #42145e, transparent 42%), #09051a;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid rgba(232, 121, 249, 0.3);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      p {
        color: #cbd5e1;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: #9333ea;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>JUDEVu.</p>
      <h1>Estás sin conexión</h1>
      <p>La versión visitada del portafolio seguirá disponible cuando recuperes internet.</p>
      <a href="/">Intentar nuevamente</a>
    </main>
  </body>
</html>
