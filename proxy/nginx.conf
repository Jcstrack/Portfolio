limit_req_zone $binary_remote_addr zone=portfolio_api_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=portfolio_connections:10m;

upstream portfolio_frontend {
    server frontend:80;
    keepalive 16;
}

upstream portfolio_api {
    server api:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=portfolio_api_rate burst=20 nodelay;
        limit_conn portfolio_connections 20;
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_hide_header X-Powered-By;
    }

    location / {
        limit_conn portfolio_connections 20;

        proxy_pass http://portfolio_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
